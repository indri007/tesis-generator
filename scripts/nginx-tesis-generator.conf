server {
    listen 80;
    server_name audit-tesis.com www.audit-tesis.com; # Ganti dengan domain Anda

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Header wajib untuk WebSocket Streamlit
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout panjang untuk proses audit/LLM yang lama
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;

        # Nonaktifkan buffering agar update real-time tidak tertahan
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Endpoint WebSocket khusus Streamlit
    location /_stcore/stream {
        proxy_pass http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
