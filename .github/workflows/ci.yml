name: CI Pipeline & Academic Compliance Audit

on:
  workflow_dispatch:
  # Automated runs handled by CircleCI or local BIT runner when GitHub Actions minutes are limited
  # push:
  #   branches: [ main, master ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr tesseract-ocr-ind

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Security & Secret Leak Verification
        run: |
          echo "Verifying no tracked credentials or private keys..."
          ! git ls-files | grep -iE '(\.env$|secrets\.toml$|.*\.pem$|.*\.key$|credentials.*\.json$)'

      - name: Python Syntax & Compilation Verification
        run: |
          python -m compileall -q app.py core/ engines/ parsers/ models/

      - name: Run Full Pytest Suite
        run: |
          pytest -v --durations=10
