[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tesischeck"
version = "0.1.0"
description = "AI Thesis Auditor for MIKOM 2026 based on PEDOMAN PENULISAN TESIS MIKOM 2026"
authors = [
    { name = "MIKOM 2026 Team", email = "tesischeck@upnjatim.ac.id" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # Core Document & Web Application
    "streamlit>=1.35.0",
    "python-docx>=1.1.0",
    "pypdf>=4.2.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "reportlab>=4.2.0",
    "openpyxl>=3.1.2",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
    "jsonschema>=4.20.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "plotly>=5.20.0",

    # Hugging Face Ecosystem
    "sentence-transformers>=2.7",
    "transformers>=4.41.0,<5.0.0",
    "torch>=2.2",
    "huggingface-hub>=0.20.0",

    # Pemrosesan Bahasa Indonesia
    "Sastrawi>=1.0.1",

    # Machine Learning & Utilitas
    "scikit-learn>=1.4",
    "scipy>=1.10",
    "numpy>=1.24",
    "tqdm>=4.66",

    # Academic Integrity & OCR
    "aegis-integrity[ml]>=1.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engines*", "models*", "parsers*", "rules*", "utils*", "auditors*"]

[tool.ruff]
exclude = ["datasets", ".venv", "build", "dist", "data"]

[tool.ruff.lint]
ignore = ["BLE001", "S110", "SIM102", "SIM117"]

