[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-thesis-generator"
version = "0.1.0"
description = "AI Thesis Generator & Scientific RAG Auditor — Automated Academic Thesis Builder and Compliance Checker"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MIKOM Research Team", email = "research-mikom@upnjatim.ac.id" }
]
dependencies = [
    "streamlit>=1.40.0",
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "jsonschema>=4.23.0",
    "reportlab>=4.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest-cov>=5.0.0"
]
rag = [
    "llama-index-core",
    "llama-index-llms-ollama",
    "llama-index-embeddings-ollama",
    "ragas",
    "datasets"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "app*", "engines*", "parsers*", "models*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "vendor",
    ".venv",
    "build",
    "dist",
    "data"
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "BLE001", "S110", "SIM102", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
